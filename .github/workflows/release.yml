# Build and publish the TAS container images to GitHub Container
# Registry (GHCR) on every CalVer release tag.
#
# Trigger: pushing a tag like `v2026.5.29` (the same tag that cuts a
# GitHub Release). Produces, for each of the two services:
#
#   ghcr.io/<owner>/tas-api:2026.5.29   ghcr.io/<owner>/tas-web:2026.5.29
#   ghcr.io/<owner>/tas-api:2026.5      ghcr.io/<owner>/tas-web:2026.5
#   ghcr.io/<owner>/tas-api:latest      ghcr.io/<owner>/tas-web:latest
#
# Customers consume these via compose.release.yaml (no source build).
# Postgres is the upstream official image and is never republished here.
#
# Scope (step 1 / MVP): linux/amd64 only, build + push + SBOM/provenance.
# Multi-arch (arm64 via a native runner), cosign signing, and a Trivy
# gate are the next hardening pass — see the image-publishing strategy.

name: Release images

on:
  push:
    tags:
      - "v*"
  # Manual re-publish of an existing tag if a run needs replaying.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing git tag to (re)build, e.g. v2026.5.29"
        required: true

permissions:
  contents: read
  packages: write
  id-token: write # reserved for cosign keyless signing (next pass)

jobs:
  images:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: tas-api
            context: ./api
          - image: tas-web
            context: ./web
    steps:
      - name: Check out the tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags + labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          # `v2026.5.29` → 2026.5.29 + 2026.5 + latest. metadata-action
          # only moves `latest` for the highest semver tag (latest=auto).
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          flavor: |
            latest=auto

      - name: Build and push ${{ matrix.image }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          # Omitting `platforms` builds for the runner arch (amd64).
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
          provenance: true
          sbom: true
