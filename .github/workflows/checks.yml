name: checks

# Lightweight CI gate. Runs on PRs and pushes to main, and is also
# callable (workflow_call) so the internal deploy pipeline can require it
# before shipping. Blocking checks cover web typecheck + tests (vitest) +
# eslint, and api fmt + clippy + tests (cargo test).

on:
  pull_request:
  # main pushes run checks via the deploy-internal pipeline (workflow_call
  # below), so no standalone push trigger here — avoids a duplicate run.
  workflow_call:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v6
      # Pin explicitly: action-setup looks for `packageManager` in the
      # repo-root package.json, but ours lives in web/. Keep in sync with
      # web/package.json's packageManager field.
      - uses: pnpm/action-setup@v6
        with:
          version: 10.24.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install deps
        run: pnpm install --frozen-lockfile --config.minimum-release-age=0
      - name: Typecheck (blocking)
        run: npx tsc --noEmit
      - name: Test (blocking)
        run: pnpm test
      - name: Lint (blocking)
        run: npx eslint .

  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: api
      - name: Format (blocking)
        run: cargo fmt --check
      # No `-D warnings`: there's a pre-existing clippy lint
      # (enum_variant_names) we haven't addressed. This still fails the
      # build on compile errors and clippy *errors*.
      - name: Clippy (blocking)
        run: cargo clippy --all-targets
      - name: Test (blocking)
        run: cargo test
