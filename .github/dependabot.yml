# Dependabot version updates. One entry per ecosystem/manifest in this monorepo.
# Related packages are grouped so an upgrade lands as a single coherent PR —
# in particular Astro + Starlight must move together (Starlight pins an Astro
# major as a peer dep; bumping one without the other breaks the docs build).

version: 2
updates:
  # Docs site (Astro Starlight). pnpm → npm ecosystem.
  - package-ecosystem: "npm"
    directory: "/docs"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      astro:
        patterns:
          - "astro"
          - "@astrojs/*"
          - "sharp"

  # Web app (Next.js). Group the noisy dev/types/lint churn into one PR.
  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      types:
        patterns:
          - "@types/*"
      lint:
        patterns:
          - "eslint"
          - "eslint-*"
          - "@typescript-eslint/*"
          - "prettier"

  # API (Rust).
  - package-ecosystem: "cargo"
    directory: "/api"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  # GitHub Actions used by the workflows.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
