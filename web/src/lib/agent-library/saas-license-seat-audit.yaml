  READ / INPUT: The records to scan (read-only). [this agent: SaaS admin read]
  LOGIC: Scan for the defined quality condition. Collect each offending record with the reason it was flagged.
  OUTPUT: Write findings to a tasks/review inbox or notify the owner. Never auto-correct. [this agent: SaaS admin read]
